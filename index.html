const visualKey=x=>({gaslighting:"Gaslight",gaslight:"Gaslight",special:"Special"})[String(x).trim().toLowerCase()]||String(x).trim();const categories=[...new Set(DATA.cards.map(c=>visualKey(c.category)))];categories.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;$('filter').append(o)});
let deck=[],pos=0,score=0,chickens=3,revealed=false,decided=false,rotX=0,rotY=0,drag=null,blockClick=false;
function shuffled(items){let a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refreshStats(){$('score').textContent=score;$('tokens').textContent='🐔'.repeat(chickens)+'✕'.repeat(3-chickens);$('counter').textContent=`Card ${Math.min(pos+1,deck.length)} of ${deck.length}`}
function tilt(){let flip=revealed?180:0;$('card').style.transform=`rotateX(${rotX}deg) rotateY(${flip+rotY}deg)`}
function showCard(){refreshStats();$('stage').style.display='flex';$('card').style.display='block';$('help').textContent='Drag to tilt in 3D. Tap to reveal.';$('no').hidden=true;$('yes').hidden=true;$('next').hidden=true;revealed=false;decided=false;$('card').classList.remove('is-revealed');rotX=0;rotY=0;tilt();if(pos>=deck.length||chickens===0){end();return}let c=deck[pos],visualCategory=visualKey(c.category),color=DATA.colors[visualCategory]||'#fff';$('category').textContent=c.category;$('cardFront').style.setProperty('--card-color',color);$('cardFront').style.background=visualCategory==='Special'?'':color;$('cardFront').style.setProperty('--card-ink',['Stupid','Gross','Big Trouble','Nuclear'].includes(visualCategory)?'#080808':'#fff');$('cardFront').classList.toggle('special',visualCategory==='Special');$('challenge').textContent=c.text;$('challenge').className='challenge'+(c.text.length>240?' verylong':c.text.length>130?' long':'');$('points').textContent=c.points+' PTS';let ico=DATA.icons[visualCategory];$('categoryIcon').hidden=!ico;$('categoryIcon').src=ico||'';$('categoryLabel').hidden=!!ico;$('categoryLabel').textContent=c.category;}
function reveal(){if(revealed||decided)return;revealed=true;$('card').classList.add('is-revealed');rotX=0;rotY=0;tilt();$('no').hidden=false;$('yes').hidden=false;$('help').textContent='Accept for points or decline and lose one Chicken token.'}
function choose(yes){if(!revealed||decided)return;decided=true;if(yes)score+=Number(deck[pos].points)||0;else chickens=Math.max(0,chickens-1);refreshStats();$('yes').hidden=true;$('no').hidden=true;$('next').hidden=false;$('help').textContent=yes?'Points added!':'One Chicken token lost.';$('next').textContent=(chickens===0||pos===deck.length-1)?'SEE RESULTS →':'NEXT CARD →'}
function end(){$('card').style.display='none';$('no').hidden=true;$('yes').hidden=true;$('next').hidden=true;$('help').innerHTML=`<div class="end"><h2>GAME OVER</h2><p>Final score: <strong>${score}</strong></p><p>${chickens===0?'No Chicken tokens remaining.':'You finished the deck!'}</p><p>Tap Restart to play again.</p></div>`}
function start(){deck=shuffled(DATA.cards.filter(c=>$('filter').value==='All'||visualKey(c.category)===$('filter').value));pos=0;score=0;chickens=3;showCard()}

$('yes').onclick=()=>choose(true);$('no').onclick=()=>choose(false);$('next').onclick=()=>{pos++;showCard()};$('restart').onclick=start;$('filter').onchange=start;
const c=$('card');c.addEventListener('pointerdown',e=>{if(!deck.length||pos>=deck.length)return;drag={x:e.clientX,y:e.clientY,moved:false};c.setPointerCapture(e.pointerId);c.classList.add('dragging')});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;rotY=Math.max(-22,Math.min(22,dx*.17));rotX=Math.max(-18,Math.min(18,-dy*.16));tilt()});c.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;c.classList.remove('dragging');tilt();if(moved){blockClick=true;setTimeout(()=>blockClick=false,100)}else if(!blockClick)reveal()});c.addEventListener('pointercancel',()=>{drag=null;c.classList.remove('dragging');rotX=rotY=0;tilt()});
